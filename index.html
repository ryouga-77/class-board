<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学級掲示板 OS v4.0 UD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Inter:wght@100;400;700;900&display=swap');
        
        :root { 
            --bg: #080808; 
            --card: #121212; 
            --border: #1f1f1f; 
            --text-scale: 1; /* 文字サイズ用変数 */
        }
        body { 
            font-family: 'BIZ UDPGothic', sans-serif; 
            background-color: var(--bg); 
            color: #fff; 
            letter-spacing: 0.02em;
        }
        
        .matte-input { background: var(--card); border: 1px solid var(--border); color: #fff; outline: none; transition: 0.2s; }
        .matte-input:focus { border-color: #555; background: #181818; }
        
        #board-canvas { 
            width: 1080px; 
            min-height: 1080px; 
            height: auto; 
            background: #fff; 
            color: #000; 
            padding: 75px 85px 120px 85px; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }

        #board-canvas.theme-dark { background: #000; color: #fff; }
        #board-canvas.theme-dark .text-slate-900 { color: #fff; }
        #board-canvas.theme-dark .text-slate-300 { color: #555; }
        #board-canvas.theme-dark .border-black { border-color: #fff; }
        #board-canvas.theme-dark .border-slate-900 { border-color: #fff; }
        #board-canvas.theme-dark .bg-slate-50 { background: #111; border: 1px solid #333; }
        #board-canvas.theme-dark .bg-white { background: #222; }
        #board-canvas.theme-dark i { color: #fff !important; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        mark { 
            background: linear-gradient(transparent 50%, #fff176 50%); 
            padding: 0 2px; 
            color: inherit; 
            font-weight: 700;
        }
        #board-canvas.theme-dark mark { 
            background: linear-gradient(transparent 50%, #d32f2f 50%); 
            color: #fff; 
        }
        strong { 
            font-weight: 700; 
            color: #000;
            background: rgba(0,0,0,0.03);
            padding: 0 4px;
            border-radius: 4px;
        }
        #board-canvas.theme-dark strong {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .step-item { transition: all 0.3s; cursor: pointer; }
        .step-item.checked { opacity: 0.4; text-decoration: line-through; }
        
        /* ドラッグ用ハンドル */
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.5; background: #1a1a1a; }
        
        /* 動的文字サイズ */
        .dynamic-text { font-size: calc(32px * var(--text-scale)); }
        .dynamic-bullet { font-size: calc(32px * var(--text-scale)); }
    </style>
</head>
<body class="p-6 lg:p-12">

    <div class="max-w-[1450px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-5 space-y-6 overflow-y-auto max-h-screen pr-4 pb-20 hide-scrollbar">
            <header class="flex justify-between items-center border-b border-[#1f1f1f] pb-4">
                <h1 class="text-2xl font-bold italic tracking-tighter uppercase">Board OS <span class="text-blue-500">v4.0</span></h1>
                <div class="flex gap-2">
                    <button onclick="fetchAllWeatherData()" class="text-[10px] font-bold bg-blue-600 px-4 py-2 rounded-full hover:bg-blue-500 transition-all flex items-center gap-2">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 気象更新
                    </button>
                </div>
            </header>

            <div class="bg-[#121212] p-6 rounded-3xl border border-[#1f1f1f] space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">テーマ</label>
                        <select id="in-theme" class="matte-input w-full p-3 rounded-2xl font-bold" oninput="render()">
                            <option value="white">⚪ White</option>
                            <option value="dark">⚫ Dark</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">スタイル</label>
                        <select id="in-period-min" class="matte-input w-full p-3 rounded-2xl font-bold" oninput="render()">
                            <option value="50">50分授業</option>
                            <option value="45">45分授業</option>
                            <option value="B日程">B日程</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-[#1f1f1f]">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">定期テスト日程</label>
                        <input type="date" id="in-test-date" class="matte-input w-full p-3 rounded-2xl font-bold text-xs" value="2026-06-26" oninput="render()">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">本文の文字サイズ</label>
                        <div class="flex items-center gap-3 p-3">
                            <span class="text-xs">小</span>
                            <input type="range" id="in-font-size" min="0.7" max="1.5" step="0.1" value="1" class="w-full accent-blue-500" oninput="render()">
                            <span class="text-xs">大</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-[#1f1f1f]">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">天気</label>
                        <select id="in-weather" class="matte-input w-full p-3 rounded-2xl font-bold" oninput="render()">
                            <option value="sun">☀️ 晴れ</option>
                            <option value="cloud">☁️ 曇り</option>
                            <option value="cloud-rain">☔ 雨</option>
                            <option value="snowflake">❄️ 雪</option>
                            <option value="cloud-lightning">⚡ 雷雨</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">気温</label>
                        <input type="text" id="in-temp" class="matte-input w-full p-3 rounded-2xl font-bold text-center" placeholder="--℃" oninput="render()">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-yellow-500 uppercase tracking-widest ml-1 mb-1 block">緊急連絡（テロップ）</label>
                    <input type="text" id="in-marquee" class="matte-input w-full p-3 rounded-2xl font-bold" placeholder="流したい文字を入力" oninput="render()">
                </div>
            </div>

            <div class="bg-[#121212] p-6 rounded-3xl border border-red-900/30 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-[10px] font-bold text-red-400 uppercase tracking-[0.2em] flex items-center gap-2 italic">
                        <i data-lucide="siren" class="w-3.5 h-3.5"></i> 台風・防災アラート
                    </h3>
                    <input type="checkbox" id="in-typhoon-toggle" class="accent-red-500 w-4 h-4" onchange="render()">
                </div>
                <div class="grid grid-cols-2 gap-4" id="typhoon-settings">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">警戒レベル</label>
                        <select id="in-alert-level" class="matte-input w-full p-3 rounded-2xl font-bold text-xs" oninput="render()">
                            <option value="【注意】強風・大雨に注意">注意報レベル</option>
                            <option value="【警戒】台風接近中・不要な外出控える">警報レベル</option>
                            <option value="【特別警戒】命を守る行動を">特別警報レベル</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 mb-1 block">詳細情報</label>
                        <input type="text" id="in-typhoon-info" class="matte-input w-full p-3 rounded-2xl font-bold text-xs" placeholder="例: 台風〇号接近中" oninput="render()">
                    </div>
                </div>
            </div>

            <div class="bg-[#121212] p-6 rounded-3xl border border-[#1f1f1f] space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] flex items-center gap-2 italic">
                        <i data-lucide="grid" class="w-3.5 h-3.5"></i> 時間割
                    </h3>
                    <input type="number" id="in-total-periods" class="matte-input w-16 p-1 rounded-lg text-center text-xs" value="6" min="1" max="8" oninput="updateTimetableInputs()">
                </div>
                <div id="timetable-inputs-container" class="grid grid-cols-2 gap-3"></div>
            </div>

            <div id="dynamic-sections" class="space-y-4"></div>

            <button onclick="addSection()" class="w-full py-4 border-2 border-dashed border-[#222] rounded-2xl text-slate-500 font-bold hover:border-slate-400 hover:text-slate-300 transition-all flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-5 h-5"></i> 項目を追加
            </button>

            <button onclick="exportImage()" class="w-full py-6 bg-white text-black font-bold rounded-3xl shadow-2xl transition-all text-sm tracking-[0.2em] uppercase hover:bg-slate-200">
                画像を保存して送信
            </button>
            
            <button onclick="clearStorage()" class="w-full py-2 text-[10px] text-slate-700 hover:text-red-500 transition-colors uppercase tracking-widest">
                設定をリセット
            </button>
        </div>

        <div class="lg:col-span-7 flex flex-col items-center">
            <div style="transform: scale(0.42); transform-origin: top center;">
                <div id="board-canvas" class="shadow-[0_50px_100px_rgba(0,0,0,0.3)]">
                    <header class="flex justify-between items-start border-b-[16px] border-black pb-10">
                        <div>
                            <div class="text-[15px] font-bold tracking-[0.5em] text-slate-300 mb-2 uppercase italic">Daily Briefing / Murata-Cho</div>
                            <h2 class="text-7xl font-light tracking-[0.02em] text-slate-900 leading-none">事務連絡</h2>
                        </div>
                        <div class="flex gap-10 text-right">
                            <div id="out-countdown-area" class="hidden flex-col items-center justify-center bg-blue-50 text-blue-900 border-2 border-blue-200 px-6 py-2 rounded-3xl">
                                <span class="text-sm font-bold tracking-widest uppercase">定期テストまで</span>
                                <div class="text-4xl font-black italic">あと<span id="out-countdown-days" class="text-6xl mx-2 text-blue-600">0</span>日</div>
                            </div>
                            <div>
                                <p id="out-date" class="text-5xl font-bold tracking-tighter mb-2 italic">--/-- (--)</p>
                                <div class="flex flex-col items-end gap-1">
                                    <div id="out-weather-icon" class="bg-white p-1 mb-1 rounded-sm shadow-sm"></div>
                                    <p id="out-temp" class="text-2xl font-medium text-slate-400 italic">--℃</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div id="out-typhoon-area" class="hidden mt-6 bg-red-600 text-white p-6 rounded-3xl border-4 border-red-800 flex items-center gap-6 shadow-lg">
                        <div class="bg-white rounded-full p-4 animate-pulse">
                            <i data-lucide="triangle-alert" class="w-12 h-12 text-red-600"></i>
                        </div>
                        <div>
                            <h3 id="out-typhoon-level" class="text-4xl font-black tracking-tight mb-2">警戒レベル</h3>
                            <p id="out-typhoon-info" class="text-2xl font-bold opacity-90">詳細情報</p>
                        </div>
                    </div>

                    <div class="mt-
